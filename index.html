<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天机 · 星轨摇号</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  :root{
    --gold:#ffd76a;
    --gold2:#f5a623;
    --red:#ff5a5a;
    --blue:#5ab4ff;
    --ink:#04040c;
    --text:#e9e6ff;
  }
  body{
    margin:0;
    background:
      radial-gradient(1100px 680px at 50% -8%, rgba(128,84,255,.30), transparent 62%),
      radial-gradient(820px 560px at 86% 16%, rgba(255,120,200,.10), transparent 64%),
      radial-gradient(900px 620px at 50% 116%, rgba(255,160,70,.18), transparent 62%),
      radial-gradient(700px 520px at 92% 66%, rgba(90,120,255,.08), transparent 66%),
      #03030a;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    align-items:stretch;
    padding:16px 14px 20px;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .aurora{
    position:fixed;inset:-18%;z-index:0;pointer-events:none;
    background:
      radial-gradient(38% 30% at 22% 28%, rgba(130,78,255,.34), transparent 70%),
      radial-gradient(34% 26% at 80% 20%, rgba(255,110,210,.20), transparent 70%),
      radial-gradient(42% 30% at 60% 82%, rgba(60,175,255,.22), transparent 72%),
      radial-gradient(30% 24% at 30% 78%, rgba(255,175,60,.14), transparent 70%),
      radial-gradient(30% 22% at 12% 62%, rgba(90,130,255,.14), transparent 72%);
    filter:blur(30px);
    animation:auroraDrift 28s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift{
    0%{transform:translate3d(-2%,-1%,0) scale(1.02)}
    50%{transform:translate3d(2%,1.5%,0) scale(1.1)}
    100%{transform:translate3d(-1%,2%,0) scale(1.04)}
  }
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 50% 45%, transparent 38%, rgba(0,0,0,.55) 100%);
  }
  body.glow .vignette{animation:vglow 1.2s ease-out}
  @keyframes vglow{
    0%{box-shadow:inset 0 0 0 rgba(255,200,80,0)}
    28%{box-shadow:inset 0 0 280px rgba(255,200,80,.30)}
    100%{box-shadow:inset 0 0 0 rgba(255,200,80,0)}
  }

  /* ---------- header ---------- */
  header{
    position:relative;z-index:3;
    width:100%;max-width:880px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .brand{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:15px;letter-spacing:.55em;color:rgba(255,215,120,.88);
    text-shadow:0 0 26px rgba(255,200,80,.35);
    padding-left:.55em;
  }
  .tabs{
    display:flex;gap:3px;padding:3px;border-radius:999px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .tabs button{
    appearance:none;border:0;background:transparent;color:rgba(233,230,255,.5);
    font:inherit;font-size:12.5px;padding:7px 13px;border-radius:999px;
    cursor:pointer;letter-spacing:.1em;transition:.28s;white-space:nowrap;
  }
  .tabs button.on{
    background:linear-gradient(180deg,rgba(255,215,120,.96),rgba(245,166,35,.92));
    color:#2a1800;font-weight:600;
    box-shadow:0 4px 16px rgba(245,166,35,.35);
  }
  .toolbar{
    width:100%;display:flex;align-items:center;justify-content:center;
    gap:10px;margin-top:9px;flex-wrap:wrap;
  }
  .toolbar .lbl{font-size:10.5px;letter-spacing:.24em;color:rgba(233,230,255,.3)}
  .seg{
    display:flex;gap:2px;padding:2px;border-radius:999px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  }
  .seg button{
    appearance:none;border:0;background:transparent;color:rgba(233,230,255,.42);
    font:inherit;font-size:11px;padding:5px 12px;border-radius:999px;
    cursor:pointer;letter-spacing:.08em;transition:.25s;white-space:nowrap;
  }
  .seg button.on{
    background:rgba(255,215,120,.15);color:#ffe9b0;
    box-shadow:inset 0 0 0 1px rgba(255,215,120,.32);
  }

  /* ---------- stage ---------- */
  main{
    position:relative;z-index:2;
    width:100%;max-width:880px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:8px 0;
  }

  /* ---------- orb ---------- */
  .orb-wrap{
    position:relative;
    width:min(60vmin,380px);aspect-ratio:1;
    display:grid;place-items:center;
    flex:none;
  }
  .orb{
    position:absolute;inset:0;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%, rgba(130,90,255,.16), rgba(12,7,32,.86) 60%, rgba(4,4,12,0) 74%);
    box-shadow:inset 0 0 90px rgba(130,90,255,.25), 0 0 90px rgba(90,60,220,.18);
    transition:box-shadow .9s ease;
  }
  body[data-phase="done"] .orb{
    box-shadow:inset 0 0 130px rgba(255,190,70,.30), 0 0 150px rgba(255,180,60,.34);
  }
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(255,215,120,.16);transition:border-color .5s}
  .r1{inset:3%;border-top-color:rgba(255,215,120,.8);border-right-color:rgba(255,215,120,.04);animation:spin 16s linear infinite}
  .r2{inset:12%;border-left-color:rgba(120,220,255,.6);border-bottom-color:rgba(120,220,255,.04);animation:spin 24s linear infinite reverse}
  .r3{inset:22%;border-top-color:rgba(255,140,220,.4);animation:spin 10s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  body[data-phase="spin"] .r1{animation-duration:1.05s;border-top-color:rgba(255,215,120,1)}
  body[data-phase="spin"] .r2{animation-duration:1.6s;border-left-color:rgba(120,220,255,.95)}
  body[data-phase="spin"] .r3{animation-duration:.85s;border-top-color:rgba(255,140,220,.95)}

  .core{
    position:relative;width:58%;aspect-ratio:1;border-radius:50%;
    display:grid;place-items:center;overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%, transparent 27.6%, rgba(255,215,120,.11) 28%, transparent 28.5%),
      radial-gradient(circle at 50% 50%, transparent 41.6%, rgba(150,195,255,.09) 42%, transparent 42.5%),
      radial-gradient(circle at 50% 50%, transparent 55.6%, rgba(255,150,220,.075) 56%, transparent 56.5%),
      radial-gradient(circle at 50% 38%, rgba(76,48,180,.64), rgba(7,5,20,.97) 72%);
    box-shadow:inset 0 0 72px rgba(0,0,0,.9), 0 0 62px rgba(255,215,120,.12);
  }
  .core::after{
    content:"";position:absolute;left:50%;top:50%;width:9%;aspect-ratio:1;z-index:0;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 42% 36%,#fff 0%,rgba(255,226,150,.9) 34%,rgba(255,190,70,.24) 66%,transparent 78%);
    box-shadow:0 0 18px rgba(255,205,100,.45),0 0 46px rgba(255,180,60,.18);
    opacity:.55;transition:opacity .8s ease;
    animation:coreHalo 3.4s ease-in-out infinite;
  }
  body[data-phase="done"] .core::after{opacity:.16}
  @keyframes coreHalo{
    0%,100%{transform:translate(-50%,-50%) scale(.9)}
    50%{transform:translate(-50%,-50%) scale(1.12)}
  }
  .core .flash{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;opacity:0;
    background:radial-gradient(circle,rgba(255,238,180,.95),rgba(255,205,95,.4) 36%,transparent 66%);
  }
  .core .flash.go{animation:coreFlash .55s ease-out}
  @keyframes coreFlash{0%{opacity:.95;transform:scale(.3)}70%{opacity:.45}100%{opacity:0;transform:scale(1.45)}}
  .swarm{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .45s}
  .swarm i{
    position:absolute;border-radius:50%;
    width:var(--s);height:var(--s);
    left:calc(var(--x) * 1% - var(--s) / 2);
    top:calc(var(--y) * 1% - var(--s) / 2);
    background:radial-gradient(circle at 32% 28%,#fff,rgba(255,255,255,.55) 12%,rgba(255,110,110,.92) 46%,rgba(120,20,40,.92));
    box-shadow:0 0 12px rgba(255,120,120,.6),0 0 26px rgba(255,120,120,.2);
    animation:pulse 2.6s ease-in-out infinite alternate;
  }
  .swarm i.blue{
    background:radial-gradient(circle at 32% 28%,#fff,rgba(255,255,255,.55) 12%,rgba(110,180,255,.92) 46%,rgba(15,50,130,.92));
    box-shadow:0 0 12px rgba(110,180,255,.6),0 0 26px rgba(110,180,255,.2);
  }
  .swarm i.gold{
    background:radial-gradient(circle at 32% 28%,#fff,rgba(255,255,255,.72) 12%,rgba(255,215,120,.96) 46%,rgba(170,110,10,.96));
    box-shadow:0 0 14px rgba(255,215,120,.75),0 0 32px rgba(255,190,60,.28);
  }
  @keyframes pulse{
    0%{transform:scale(.88);opacity:.78}
    100%{transform:scale(1.16);opacity:1}
  }
  body[data-phase="spin"] .swarm{
    opacity:1;
    animation:swarmSpin 2.1s linear infinite;
    filter:blur(.4px) brightness(1.1);
  }
  @keyframes swarmSpin{to{transform:rotate(360deg)}}
  body[data-phase="reveal"] .swarm{opacity:0;transition:opacity .5s}

  .hint{
    position:absolute;left:50%;bottom:2.5%;z-index:2;
    transform:translate(-50%,0);
    font-size:11.5px;letter-spacing:.3em;color:rgba(233,230,255,.52);
    transition:.5s;white-space:nowrap;
    text-shadow:0 0 14px rgba(0,0,0,.92);
  }
  .hint.swap{animation:hintSwap .6s ease both}
  @keyframes hintSwap{
    0%{opacity:0;transform:translate(-50%,7px)}
    100%{opacity:1;transform:translate(-50%,0)}
  }
  body[data-phase="idle"] .hint{opacity:0}
  body[data-phase="done"] .hint{opacity:0}

  .start{
    position:absolute;z-index:3;
    appearance:none;border:1px solid rgba(255,215,120,.48);border-radius:999px;
    padding:13px 26px;
    background:radial-gradient(circle at 50% -10%, rgba(255,215,120,.26), rgba(255,215,120,.03) 75%);
    color:#ffe9b0;font:inherit;font-size:13.5px;letter-spacing:.32em;
    cursor:pointer;white-space:nowrap;
    box-shadow:0 0 34px rgba(255,200,80,.16), inset 0 0 22px rgba(255,215,120,.10);
    transition:.45s;
    animation:breathe 3.6s ease-in-out infinite;
  }
  .start:hover{box-shadow:0 0 54px rgba(255,200,80,.34), inset 0 0 26px rgba(255,215,120,.2)}
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.92}
    50%{transform:scale(1.045);opacity:1}
  }
  body[data-phase="spin"] .start,body[data-phase="reveal"] .start{
    opacity:0;pointer-events:none;transform:translateY(12px) scale(.9);
    animation:none;
  }

  /* ---------- payout ---------- */
  .payout{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    margin-top:2px;min-height:0;width:100%;
  }
  .ticket{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:13px 22px 16px;border-radius:20px;
    background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
    border:1px solid rgba(255,215,120,.2);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.09);
    animation:rise .65s cubic-bezier(.2,.85,.25,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
  @property --ta{syntax:"<angle>";inherits:false;initial-value:0deg}
  .ticket::before{
    content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
    background:conic-gradient(from var(--ta),rgba(255,215,120,0) 0deg,rgba(255,215,120,.9) 34deg,rgba(255,215,120,0) 78deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:borderSpin 3.4s linear infinite;
  }
  @keyframes borderSpin{to{--ta:360deg}}
  .tname{
    font-size:11px;letter-spacing:.42em;color:rgba(255,215,120,.7);
    padding-left:.42em;
  }
  .tname em{font-style:normal;color:rgba(233,230,255,.35);letter-spacing:.1em;margin-left:.4em}
  .row{display:flex;align-items:center;gap:8px}
  .group{display:flex;align-items:center;gap:6px}

  .ball{
    --sz:clamp(30px,7.4vw,44px);
    width:var(--sz);height:var(--sz);border-radius:50%;
    display:grid;place-items:center;flex:none;
    font-size:calc(var(--sz)*.40);font-weight:700;
    font-variant-numeric:tabular-nums;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);
    background:radial-gradient(circle at 32% 26%,#fff 0%,rgba(255,255,255,.9) 9%,var(--c1) 40%,var(--c2) 100%);
    box-shadow:
      0 6px 16px rgba(0,0,0,.55),
      inset -5px -7px 14px rgba(0,0,0,.42),
      inset 4px 5px 10px rgba(255,255,255,.24);
    position:relative;
  }
  .ball::after{
    content:"";position:absolute;left:22%;top:14%;width:26%;height:20%;
    border-radius:50%;background:rgba(255,255,255,.75);filter:blur(2px);
    transform:rotate(-22deg);
  }
  .ball.red{--c1:#ff6262;--c2:#8f0d1e}
  .ball.blue{--c1:#62b8ff;--c2:#0c3488}
  .ball.enter{animation:flyIn .74s cubic-bezier(.16,.9,.3,1.25) both}
  @keyframes flyIn{
    0%{transform:translate(var(--dx,0px),var(--dy,0px)) scale(.1) rotate(-50deg);opacity:0;filter:blur(10px)}
    52%{transform:translate(0,0) scale(1.2) rotate(6deg);opacity:1;filter:blur(0)}
    76%{transform:translate(0,0) scale(.94) rotate(-2deg)}
    100%{transform:translate(0,0) scale(1) rotate(0)}
  }
  @keyframes pop{
    0%{transform:scale(.15) rotate(-150deg);opacity:0;filter:blur(6px)}
    55%{transform:scale(1.22) rotate(8deg);opacity:1;filter:blur(0)}
    78%{transform:scale(.94) rotate(-2deg)}
    100%{transform:scale(1) rotate(0)}
  }
  .plus{
    font-size:16px;color:rgba(255,215,120,.55);font-weight:300;
    margin:0 1px;text-shadow:0 0 12px rgba(255,200,80,.4);
  }
  .ticket .copy{
    margin-top:1px;
    appearance:none;border:1px solid rgba(255,255,255,.13);border-radius:999px;
    background:rgba(255,255,255,.05);color:rgba(233,230,255,.48);
    font:inherit;font-size:10.5px;letter-spacing:.08em;
    padding:4px 10px;cursor:pointer;transition:.22s;
    -webkit-tap-highlight-color:transparent;
  }
  .ticket .copy:hover{
    color:#ffe9b0;border-color:rgba(255,215,120,.42);
    background:rgba(255,215,120,.10);
  }
  .ticket .copy.ok{
    color:#9ef0c0;border-color:rgba(120,240,180,.45);
    background:rgba(120,240,180,.10);
  }

  /* ---------- verse / footer ---------- */
  .verse{
    min-height:24px;margin-top:8px;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:14.5px;letter-spacing:.24em;text-align:center;
    color:rgba(255,215,120,.82);
    text-shadow:0 0 18px rgba(255,180,60,.3);
    opacity:0;transform:translateY(10px);
    transition:opacity .9s .15s, transform .9s .15s;
    padding-left:.24em;
  }
  body[data-phase="done"] .verse{opacity:1;transform:none}

  footer{
    position:relative;z-index:3;
    text-align:center;font-size:10.5px;line-height:1.9;
    color:rgba(233,230,255,.26);letter-spacing:.12em;
    padding-top:12px;
  }
  footer b{color:rgba(255,215,120,.4);font-weight:400}
  .mute{
    position:fixed;right:14px;bottom:14px;z-index:4;
    appearance:none;border:1px solid rgba(255,255,255,.1);border-radius:999px;
    background:rgba(255,255,255,.04);color:rgba(233,230,255,.45);
    width:38px;height:38px;font-size:15px;cursor:pointer;
    backdrop-filter:blur(8px);transition:.25s;
  }
  .mute:hover{color:var(--gold);border-color:rgba(255,215,120,.35)}

  @media (max-width:420px){
    .orb-wrap{width:min(68vmin,330px)}
    .brand{letter-spacing:.4em;font-size:14px}
    .tabs button{font-size:11.5px;padding:6px 10px}
    .ticket{padding:11px 16px 14px;gap:8px;border-radius:17px}
    .group{gap:5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.001s!important}
  }
</style>
</head>
<body data-phase="idle">
<canvas id="bg"></canvas>
<div class="aurora"></div>
<div class="vignette"></div>

<header>
  <div class="brand">天 机</div>
  <nav class="tabs" id="tabs">
    <button data-mode="ssq" class="on">双色球</button>
    <button data-mode="dlt">大乐透</button>
    <button data-mode="both">同时摇</button>
  </nav>
  <div class="toolbar">
    <span class="lbl">择号</span>
    <div class="seg" id="strat">
      <button data-strat="random">纯随机</button>
      <button data-strat="contrarian" class="on">反人群</button>
    </div>
  </div>
</header>

<main>
  <div class="orb-wrap">
    <div class="orb">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="core">
        <div class="swarm" id="swarm"></div>
        <div class="flash" id="coreFlash"></div>
        <button class="start" id="startBtn">启 动 占 卜</button>
      </div>
      <div class="hint" id="hint">星轨待启</div>
    </div>
  </div>

  <div class="payout" id="payout"></div>
  <div class="verse" id="verse"></div>
</main>

<footer>
  <div>号码由密码学随机数生成 · 每注中奖概率固定 · 本页只负责仪式感</div>
  <div><b>纯随机</b> 等概率 · <b>反人群</b> 避开热门号与常见图案，不改变中奖概率，只改善分奖期望</div>
  <div><b>双色球</b> 33 选 6 + 16 选 1　　<b>大乐透</b> 35 选 5 + 12 选 2</div>
</footer>

<button class="mute" id="muteBtn" title="静音 / 取消静音">♪</button>

<script>
(function(){
  "use strict";

  /* ================= 随机与出号 ================= */
  function randInt(n){
    // 无偏 [0,n)
    const limit = Math.floor(0xFFFFFFFF / n) * n;
    const buf = new Uint32Array(1);
    let v;
    do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
    return v % n;
  }
  function pickUnique(n, k){
    const pool = new Array(n);
    for (let i = 0; i < n; i++) pool[i] = i + 1;
    const out = [];
    for (let i = 0; i < k; i++){
      const j = i + randInt(n - i);
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
      out.push(pool[i]);
    }
    return out.sort(function(a,b){ return a - b; });
  }

  const GAMES = {
    ssq:{ name:"双色球", sub:"6+1", pools:[{n:33,k:6,tone:"red"},{n:16,k:1,tone:"blue"}] },
    dlt:{ name:"大乐透", sub:"5+2", pools:[{n:35,k:5,tone:"red"},{n:12,k:2,tone:"blue"}] }
  };

  /* ================= 择号策略 ================= */
  const HOT = [4,24,30,22,13,14];        // 近 3 月最热红球
  const LAST_DRAW = [4,5,20,21,26,30];   // 最近一期红球（26123）

  function hasPattern(nums){
    for (let i = 1; i < nums.length; i++){
      if (nums[i] - nums[i-1] === 1) return true;             // 连号
    }
    const tails = nums.map(function(n){ return n % 10; });
    if (new Set(tails).size !== tails.length) return true;    // 同尾
    const odd = nums.filter(function(n){ return n % 2; }).length;
    if (odd === 0 || odd === nums.length) return true;        // 全奇 / 全偶
    return false;
  }

  function contrarianPools(game){
    const g = GAMES[game];
    const p0 = g.pools[0], p1 = g.pools[1];

    function accept(reds, strict){
      const sum = reds.reduce(function(a,b){ return a+b; }, 0);
      if (game === "ssq"){
        if (reds.indexOf(32) < 0 && reds.indexOf(33) < 0) return false;  // 必须含 32/33
        if (sum >= 90 && sum <= 110) return false;                        // 避开舒适区和值
        if (sum < 58 || sum > 162) return false;
      } else {
        if (reds.indexOf(34) < 0 && reds.indexOf(35) < 0) return false;
        if (sum >= 70 && sum <= 110) return false;
        if (sum < 46 || sum > 152) return false;
      }
      if (strict && hasPattern(reds)) return false;                       // 不打常见图案
      if (game === "ssq" && strict){
        let hot = 0, dup = 0;
        for (let i = 0; i < reds.length; i++){
          if (HOT.indexOf(reds[i]) >= 0) hot++;
          if (LAST_DRAW.indexOf(reds[i]) >= 0) dup++;
        }
        if (hot > 1) return false;                                        // 不追热号
        if (dup > 1) return false;                                        // 不抄上期
      }
      return true;
    }

    function pickBlue(){
      if (game !== "ssq") return pickUnique(p1.n, p1.k);
      for (;;){
        const b = pickUnique(16, 1);
        if (b[0] !== 3 && b[0] !== 4) return b;   // 避开最热蓝球
      }
    }

    for (let t = 0; t < 900; t++){
      const reds = pickUnique(p0.n, p0.k);
      if (!accept(reds, t < 700)) continue;
      return [reds, pickBlue()];
    }
    for (let t = 0; t < 200; t++){                 // 兜底：只保留最核心两条
      const reds = pickUnique(p0.n, p0.k);
      const sum = reds.reduce(function(a,b){ return a+b; }, 0);
      if (game === "ssq" && reds.indexOf(32) < 0 && reds.indexOf(33) < 0) continue;
      if (game === "dlt" && reds.indexOf(34) < 0 && reds.indexOf(35) < 0) continue;
      if (game === "ssq" && sum >= 82 && sum <= 118) continue;
      if (game === "dlt" && sum >= 66 && sum <= 114) continue;
      return [reds, pickBlue()];
    }
    return g.pools.map(function(p){ return pickUnique(p.n, p.k); });
  }

  /* ================= 元素 ================= */
  const $ = function(s){ return document.querySelector(s); };
  const bodyEl = document.body;
  const swarmEl = $("#swarm");
  const coreEl = document.querySelector(".core");
  const coreFlashEl = $("#coreFlash");
  const hintEl = $("#hint");
  const startBtn = $("#startBtn");
  const payoutEl = $("#payout");
  const verseEl = $("#verse");
  const tabsEl = $("#tabs");
  const stratEl = $("#strat");
  const muteBtn = $("#muteBtn");

  const pad = function(n){ return String(n).padStart(2,"0"); };
  const wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

  function legacyCopy(text){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return !!ok;
    }catch(e){ return false; }
  }
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(
        function(){ return true; },
        function(){ return legacyCopy(text); }
      );
    }
    return Promise.resolve(legacyCopy(text));
  }

  /* ================= 声音（WebAudio 合成，无外部文件） ================= */
  let ac = null, muted = false;
  function ensureAudio(){
    try{
      if (!ac){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      }
      if (ac && ac.state === "suspended") ac.resume().catch(function(){});
    }catch(e){}
  }
  function tone(o){
    if (!ac || muted || ac.state !== "running") return;
    const freq = o.freq || 440, dur = o.dur || .2, type = o.type || "sine";
    const gain = o.gain == null ? .06 : o.gain;
    try{
      const t0 = ac.currentTime + (o.delay || 0);
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(24, freq * o.slide), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + .012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t0); osc.stop(t0 + dur + .05);
    }catch(e){}
  }
  const SCALE = [0,2,4,7,9,12,14,16,19,21,24,26];
  function chime(i){
    const f = 523.25 * Math.pow(2, SCALE[(i-1) % SCALE.length] / 12);
    tone({freq:f, dur:.85, type:"sine", gain:.05});
    tone({freq:f*2, dur:.6, type:"sine", gain:.016, delay:.004});
    tone({freq:f*3.02, dur:.28, type:"triangle", gain:.007, delay:.006});
  }
  function whoosh(){
    tone({freq:180, dur:.9, type:"sawtooth", gain:.012, slide:.35});
    tone({freq:300, dur:.8, type:"sine", gain:.01, slide:.5, delay:.05});
  }
  function finale(){
    const base = 261.63;
    [0,4,7,12,16,19,24].forEach(function(s,i){
      tone({freq:base*Math.pow(2,s/12), dur:1.9, type:"sine", gain:.035, delay:i*.07});
    });
    tone({freq:65, dur:2.4, type:"sine", gain:.05});
  }

  /* ================= 星空 + 粒子 ================= */
  const canvas = $("#bg");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  let stars = [], parts = [];

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const count = Math.round(W * H / 9000);
    stars = [];
    for (let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: .35 + Math.random() * 1.15,
        ph: Math.random() * Math.PI * 2,
        tw: .4 + Math.random() * 1.5,
        c: Math.random() < .12 ? "rgba(255,215,120,.95)"
          : Math.random() < .2 ? "rgba(150,200,255,.9)" : "rgba(255,255,255,.92)",
        vx: (Math.random() - .5) * .055,
        vy: (Math.random() - .5) * .045
      });
    }
  }
  window.addEventListener("resize", resize);
  resize();

  function burst(cx, cy, toneName, n){
    const col = toneName === "blue" ? [120,190,255] : toneName === "gold" ? [255,215,120] : [255,130,130];
    const count = n || 22;
    for (let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 1.1 + Math.random() * 3.4;
      parts.push({
        x:cx, y:cy,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .7,
        life:1, dec:.011 + Math.random()*.022,
        r:.8 + Math.random()*2.1, c:col
      });
    }
  }

  let meteors = [];
  function drawMeteors(dt){
    if (Math.random() < .012){
      meteors.push({
        x: Math.random() * (W + 320) - 160, y: -40,
        vx: -(2.4 + Math.random() * 2.4), vy: (2.0 + Math.random() * 1.8),
        life: 1
      });
    }
    for (let i = meteors.length - 1; i >= 0; i--){
      const m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.life -= .01 * dt;
      if (m.life <= 0 || m.y > H + 80 || m.x < -260){ meteors.splice(i, 1); continue; }
      const tx = m.x - m.vx * 22, ty = m.y - m.vy * 22;
      const lg = ctx.createLinearGradient(m.x, m.y, tx, ty);
      lg.addColorStop(0, "rgba(255,244,205," + (m.life * .9) + ")");
      lg.addColorStop(.4, "rgba(255,215,140," + (m.life * .35) + ")");
      lg.addColorStop(1, "rgba(255,215,140,0)");
      ctx.strokeStyle = lg; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    }
  }

  let lastT = 0;
  function loop(now){
    if (!lastT) lastT = now;
    const dt = Math.min(34, now - lastT) / 16.67;
    lastT = now;

    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < stars.length; i++){
      const s = stars[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < -2) s.x = W + 2; else if (s.x > W + 2) s.x = -2;
      if (s.y < -2) s.y = H + 2; else if (s.y > H + 2) s.y = -2;
      const a = .18 + .62 * Math.abs(Math.sin(now * .001 * s.tw + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawMeteors(dt);

    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += .05 * dt;
      p.vx *= .992;
      p.life -= p.dec * dt;
      if (p.life <= 0 || p.y > H + 40){ parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = "rgb(" + p.c[0] + "," + p.c[1] + "," + p.c[2] + ")";
      ctx.shadowColor = "rgba(" + p.c[0] + "," + p.c[1] + "," + p.c[2] + ",.9)";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (.4 + p.life * .8), 0, 6.2832);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= 摇号球群 ================= */
  function buildSwarm(){
    swarmEl.innerHTML = "";
    const N = 36;
    const GOLDEN = Math.PI * (3 - Math.sqrt(5));
    const R = 38;                              // 半径上限 %（中心到边缘最多 50%），留边
    for (let i = 0; i < N; i++){
      const t = (i + .5) / N;                  // 0 → 1，由内向外
      const rad = Math.sqrt(t) * R;            // 面积均匀
      const ang = i * GOLDEN;                  // 黄金角螺旋
      const size = 15 - 8 * Math.sqrt(t);      // 中心 15px → 边缘 7px
      const b = document.createElement("i");
      b.style.setProperty("--s", size.toFixed(1) + "px");
      b.style.setProperty("--x", (50 + Math.cos(ang) * rad).toFixed(2));
      b.style.setProperty("--y", (50 + Math.sin(ang) * rad).toFixed(2));
      const r = Math.random();
      if (t < .18) b.className = (r < .8 ? "gold" : "");            // 星核：金为主
      else if (t < .62) b.className = (r < .58 ? "" : (r < .8 ? "gold" : "blue"));  // 中环：红为主
      else b.className = (r < .55 ? "blue" : (r < .85 ? "" : "gold"));              // 外环：蓝为主
      b.style.animationDuration = (2.1 + Math.random() * 1.7).toFixed(2) + "s";
      b.style.animationDelay = (-Math.random() * 2.6).toFixed(2) + "s";
      swarmEl.appendChild(b);
    }
  }
  buildSwarm();

  /* ================= 签文 ================= */
  const VERSES = [
    "星轨已定，落子无悔。",
    "此签不主吉凶，只主风雅。",
    "天机不可尽泄，二分在数，八分在缘。",
    "举重若轻，方得从容。",
    "号码已落，心事可放下了。",
    "银汉无声，一夜清辉。",
    "买一注，做一场好梦。",
    "运去金成铁，时来铁似金。",
    "心静则签清，念动则签乱。",
    "三分天意，七分闲情。",
    "此局中与不中，皆可入诗。",
    "得失在数，喜乐由人。"
  ];
  function showVerse(){
    const text = "「 " + VERSES[Math.floor(Math.random() * VERSES.length)] + " 」";
    verseEl.textContent = "";
    let i = 0;
    const t = setInterval(function(){
      i++;
      verseEl.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(t);
    }, 58);
  }

  /* ================= 状态机 ================= */
  let mode = "ssq";
  let strat = "contrarian";
  let runId = 0;
  let busy = false;

  function setPhase(p){ bodyEl.dataset.phase = p; }

  function resetCanvasFx(){ parts.length = 0; }

  function reset(){
    runId++;
    busy = false;
    setPhase("idle");
    payoutEl.innerHTML = "";
    verseEl.textContent = "";
    hintEl.textContent = "星轨待启";
    startBtn.textContent = "启 动 占 卜";
    resetCanvasFx();
  }

  function generate(game){
    if (strat === "contrarian") return contrarianPools(game);
    const g = GAMES[game];
    return g.pools.map(function(p){ return pickUnique(p.n, p.k); });
  }

  function hintText(t){ hintEl.textContent = t; }

  function burstBall(ballEl, toneName){
    const r = ballEl.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, toneName, 20);
  }

  async function revealTicket(gameName, pools, id){
    const g = GAMES[gameName];

    const ticket = document.createElement("div");
    ticket.className = "ticket";

    const nameEl = document.createElement("div");
    nameEl.className = "tname";
    nameEl.innerHTML = g.name + "<em>" + g.sub + "</em>";
    ticket.appendChild(nameEl);

    const row = document.createElement("div");
    row.className = "row";
    ticket.appendChild(row);

    const plain = g.name + "  " + pools[0].map(pad).join(" ") + "  +  " + pools[1].map(pad).join(" ");
    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "copy";
    copyBtn.textContent = "复制";
    copyBtn.addEventListener("click", function(){
      ensureAudio();
      copyText(plain).then(function(ok){
        copyBtn.textContent = ok ? "已复制" : "复制失败";
        copyBtn.classList.add("ok");
        setTimeout(function(){
          copyBtn.textContent = "复制";
          copyBtn.classList.remove("ok");
        }, 1700);
      });
    });
    ticket.appendChild(copyBtn);

    payoutEl.appendChild(ticket);
    tone({freq:392, dur:.5, type:"sine", gain:.03});
    await wait(320);
    if (id !== runId) return;

    let idx = 0;
    for (let p = 0; p < g.pools.length; p++){
      if (id !== runId) return;
      const pool = g.pools[p];

      if (p > 0){
        const plus = document.createElement("span");
        plus.className = "plus";
        plus.textContent = "+";
        row.appendChild(plus);
      }

      const group = document.createElement("div");
      group.className = "group";
      row.appendChild(group);

      const nums = pools[p];
      for (let i = 0; i < nums.length; i++){
        if (id !== runId) return;
        const b = document.createElement("span");
        b.className = "ball " + pool.tone;
        b.textContent = pad(nums[i]);
        group.appendChild(b);

        // 从星核中心飞入
        const cr = coreEl.getBoundingClientRect();
        const br = b.getBoundingClientRect();
        b.style.setProperty("--dx", (cr.left + cr.width / 2 - br.left - br.width / 2).toFixed(1) + "px");
        b.style.setProperty("--dy", (cr.top + cr.height / 2 - br.top - br.height / 2).toFixed(1) + "px");
        void b.offsetWidth;
        b.classList.add("enter");

        // 星核闪光
        coreFlashEl.classList.remove("go");
        void coreFlashEl.offsetWidth;
        coreFlashEl.classList.add("go");

        idx++;
        chime(idx);
        burstBall(b, pool.tone);
        hintText(pool.tone === "blue" ? "蓝星归位 · " + pad(nums[i]) : "第 " + idx + " 颗星归位");
        await wait(235);
      }
      await wait(130);
    }
    hintText("此注已落");
  }

  async function run(){
    if (busy) return;
    busy = true;
    const id = ++runId;

    ensureAudio();
    payoutEl.innerHTML = "";
    verseEl.textContent = "";
    resetCanvasFx();

    const games = mode === "both" ? ["ssq","dlt"] : [mode];
    const plan = games.map(function(g){ return { game:g, pools:generate(g) }; });

    setPhase("spin");
    whoosh();

    const SPIN_WORDS = ["静 心 凝 神", "星 轨 流 转", "天 机 将 现"];
    let wi = 0;
    hintText(SPIN_WORDS[0]);
    const wordTimer = setInterval(function(){
      wi = (wi + 1) % SPIN_WORDS.length;
      hintEl.classList.remove("swap");
      void hintEl.offsetWidth;
      hintEl.classList.add("swap");
      hintText(SPIN_WORDS[wi]);
    }, 640);

    const ticker = setInterval(function(){
      tone({freq:80 + Math.random()*140, dur:.045, type:"square", gain:.011});
    }, 76);
    const beatTimer = setInterval(function(){
      tone({freq:57, dur:.34, type:"sine", gain:.055, slide:.72});
      tone({freq:114, dur:.12, type:"triangle", gain:.014});
    }, 810);

    await wait(1980);
    if (id !== runId){
      clearInterval(ticker); clearInterval(beatTimer); clearInterval(wordTimer); return;
    }

    setPhase("reveal");
    clearInterval(ticker);
    clearInterval(beatTimer);
    clearInterval(wordTimer);
    hintEl.classList.remove("swap");

    for (let i = 0; i < plan.length; i++){
      if (id !== runId) return;
      await revealTicket(plan[i].game, plan[i].pools, id);
      if (id !== runId) return;
      await wait(260);
    }

    if (id !== runId) return;

    setPhase("done");
    finale();
    showVerse();
    hintText("");
    startBtn.textContent = mode === "both" ? "再 摇 一 次" : "再 掷 一 次";

    document.body.classList.add("glow");
    setTimeout(function(){ document.body.classList.remove("glow"); }, 1250);

    const orb = document.querySelector(".orb").getBoundingClientRect();
    const ox = orb.left + orb.width / 2, oy = orb.top + orb.height / 2;
    burst(ox, oy, "gold", 90);
    setTimeout(function(){ burst(ox, oy, "gold", 55); }, 230);

    busy = false;
  }

  /* ================= 交互 ================= */
  startBtn.addEventListener("click", function(){
    ensureAudio();
    run();
  });

  tabsEl.addEventListener("click", function(e){
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    if (btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    Array.prototype.forEach.call(tabsEl.querySelectorAll("button"), function(b){
      b.classList.toggle("on", b === btn);
    });
    reset();
    startBtn.textContent = mode === "both" ? "同 时 摇" : "启 动 占 卜";
  });

  stratEl.addEventListener("click", function(e){
    const btn = e.target.closest("button[data-strat]");
    if (!btn || btn.dataset.strat === strat) return;
    strat = btn.dataset.strat;
    Array.prototype.forEach.call(stratEl.querySelectorAll("button"), function(b){
      b.classList.toggle("on", b === btn);
    });
    reset();
    run();
  });

  muteBtn.addEventListener("click", function(){
    muted = !muted;
    muteBtn.textContent = muted ? "✕" : "♪";
    muteBtn.style.color = muted ? "rgba(255,120,120,.7)" : "";
  });

  /* 打开即自动摇一次（声音可能被浏览器静音，点击后恢复） */
  window.addEventListener("load", function(){
    setTimeout(function(){
      if (bodyEl.dataset.phase === "idle") run();
    }, 900);
  });

  /* 空格键再摇一次 */
  window.addEventListener("keydown", function(e){
    if (e.code === "Space" && bodyEl.dataset.phase !== "spin" && bodyEl.dataset.phase !== "reveal"){
      e.preventDefault();
      ensureAudio();
      run();
    }
  });
})();
</script>
</body>
